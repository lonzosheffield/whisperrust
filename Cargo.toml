[package]
name = "whisperrust"
version = "0.1.0"
edition = "2021"
description = "Local offline push-to-talk voice dictation daemon for Windows"
license = "MIT"
publish = false

[dependencies]
arboard = "3.6"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# NOTE: panic = "abort" is deliberately NOT set. The daemon must survive a mic unplug
# and a worker panic without taking the process down. See PLAN.md section 2.

[[bin]]
name = "whisperrust"
path = "src/main.rs"
